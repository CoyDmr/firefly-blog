backend:
  name: github
  repo: CoyDmr/firefly-blog   # 你的 GitHub 仓库
  branch: main
  base_url: https://voidcip-oauth.yxflwe.workers.dev  # 后面部署的 OAuth 代理地址
  auth_endpoint: auth

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "posts"
    label: "博客文章"
    folder: "src/content/posts"   # Firefly 的文章目录，请根据实际路径调整
    create: true
    delete: true
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "发布日期", name: "date", widget: "datetime" }
      - { label: "封面图", name: "cover", widget: "image", required: false }
      - { label: "标签", name: "tags", widget: "list", required: false }
      - { label: "正文", name: "body", widget: "markdown" }